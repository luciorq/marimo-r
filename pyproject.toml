    "ipython~=8.12.3",
    # testing gen ai
    "pydantic-ai-slim[google,anthropic,bedrock,openai]>=1.107.0,<3.0.0",
    # - google-auth uses cachetools, and cachetools<5.0.0 uses collections.MutableMapping (removed in Python 3.10)
    "cachetools>=5.0.0",
    "boto3>=1.38.46",
    # for bedrock ui chat
    # exporting as ipynb
    "nbformat>=5.10.4",
    "nbconvert>=7.17.0",
    "sympy>=1.13.3",
    "jupytext>=1.17.2",
    # For standard scientific computing/ ML
    # flax 0.10 requires jax>=0.4.27, so keep the floors compatible.
    "jax>=0.4.27; python_version == '3.12'",
    "flax>=0.10.0; python_version == '3.12'",
    "torch>=2.4.0; python_version == '3.12'",
    "scikit-bio>=0.6.3; python_version == '3.12'",
    "mcp>=1.0.0,<2",
    # zeromq
    "pyzmq>=27.1.0",
    # weave tracing integration
    "weave>=0.51.0",
    # For type-checking tests
    "basedpyright>=1.28.0",
]

typecheck = [
    "mypy~=1.15.0",
    # Types for mypy
    "altair>=5.4.0",
    "leafmap~=0.39.2",
    "panel>=1.5.3",
    "polars>=1.9.0",
    "pytest>=9.0.2",
    "duckdb>=1.0.0",
    "narwhals>=2.0.0",
    "matplotlib>=3.8.0",
    "sqlglot[c]>=26.8.0",
    "sqlalchemy>=2.0.40",
    "obstore>=0.8.2",
    "huggingface_hub>=1.24.0",
    "fsspec>=2026.2.0",
    "pydantic-ai-slim[google,anthropic,bedrock,openai]>=1.107.0,<3.0.0",
    "loro>=1.5.0",
