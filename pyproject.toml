    "mkdocs-click>=0.8.1",
    "mike>=2.0.0",  # for versioning
    "pillow>=10.2.0,!=11.3.0",  # for social cards, 11.3.0 doesn't have manylinux wheels
    "cairosvg>=2.7.1",  # for social cards
    "mdx-include>=1.4.2",
    "pymdown-extensions>=10.21.2",
    "lzstring>=1.0.4",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.13.0",
]


[tool.uv]
# Mirror CI's dependency window (UV_EXCLUDE_NEWER in .github/workflows) so local
# resolution reproduces what CI resolves at setup time, including the ruff version.
exclude-newer = "7 days"

[tool.uv.sources]
marimo_docs = { path = "./docs", editable = true }

[tool.uv.build-backend]
module-name = "marimo"
module-root = ""
source-include = ["third_party.txt", "third_party_licenses.txt"]
wheel-exclude = ["marimo/_smoke_tests/**"]

[tool.ruff]
line-length = 79
include = ["marimo/**/*.py", "tests/**/*.py", "dagger/**/*.py"]
exclude = [
    "build",
    "docs",
    "examples",
    "frontend",
    "marimo/_smoke_tests",
    "marimo/_snippets/data",
    "marimo/_static/export_demos/wasm-intro.py",
    "marimo/_test_utils/_tutorials",
    "marimo/_test_utils/codegen_data",
    "marimo/_tutorials",
    "scripts",
    "tests/_ast/app_data",
    "tests/_ast/cell_data",
    "tests/_ast/codegen_data",
    "tests/_ast/test_app.py",
    "tests/_cli/cli_data",
    "tests/**/fixtures",
    "tests/_lint/test_files",
    "tests/_runtime/runtime_data",
]

[tool.ruff.lint]
preview = true
ignore = [
    "G004",   # Logging statement uses f-string
    "TC001", # Move application import into a type-checking block
    "TC006", # Add quotes to type expression in typing.cast()
    "D301",   # Use r""" if any backslashes in a docstring
    "PERF203", # try-except within a loop incurs performance overhead; not always possible
    "PERF401", # Use {message_str} to create a transformed list; at the cost of readability
    "PERF403", # Use a dictionary comprehension instead of a for-loop; at the cost of readability
    # TODO: we should fix these, and enable this rule
    "PT011", # `pytest.raises(ValueError)` is too broad, set the `match` parameter or use a more specific exception
    "E501",  # Line too long, we still trim
    "D415", # First line should end with a period, question mark, or exclamation point
    "FA102", # Use `from __future__ import annotations`
    "PLR1711", # Useless returns. We use this currently to delimit the end of a cell.
    "ASYNC119", # Yield in context manager in async generator; required for streaming generators (LLM/SSE), no clean refactor

    # From new version of Ruff: We should fix these, but it raises too many errors
    "BLE001", # Do not catch blind exception: `Exception`
    "RUF059", # Unused unpacked variable
    "DTZ001", # `datetime.datetime()` called without a `tzinfo` argument
    "PLW1510", # `subprocess.run` without explicit `check`
    "S110", # `try`-`except`-`pass`
    "TRY004", # Type check without `TypeError`
    "SIM102", # Use a single `if` statement instead of nested `if` statements
    "SIM117", # Use a single `with` statement with multiple contexts instead of nested `with` statements
    "RUF012", # Mutable class default
    "S102", # Use of `exec`
    "PYI036", # Bad `sys.exit` annotation
    "DTZ005", # `datetime.now()` called without `tzinfo`
    "PLC0206", # Dict index without `.items()`
    "PYI066", # Put branches for newer Python versions first when branching on `sys.version_info` comparisons
    "SIM115", # Open file without context handler
    "DTZ006", # `datetime.fromtimestamp()` called without `tzinfo`
    "DTZ007", # `datetime.strptime()` called without zone
    "DTZ011", # `date.today()` used
    "TRY401", # Verbose log message
    "UP007", # Use `X | Y` for type annotations
    "DTZ012", # `date.fromtimestamp()` called without `tzinfo`
    "DTZ901", # `datetime.min` / `datetime.max` used
    "PLW0602", # Global variable not assigned
    "S112", # `try`-`except`-`continue`
    "TRY203", # Useless `try`-`except`
    "PLC0105", # Type name incorrect variance
    "PLW1508", # Invalid envvar default
    "PLW1509", # `subprocess` `preexec_fn` argument
    "DTZ002", # `datetime.today()` called without tz
    "PLE0704", # Misplaced bare `raise`
    "PLW0642", # Self or cls assignment
    "T100", # Debugger
    "UP045", # Use `X | None` for optional type annotations
    "D421", # Property docstring should not start with a verb (preview rule)
]

extend-select = [
    # pyflakes
    "F",
    # pycodestyle
    "E",
    # warning
    "W",
    # flake8 builtin-variable-shadowing
    "A001",
    # flake8 builtin-argument-shadowing
    "A002",
    # flake8-unused-arguments
    "ARG",
    # flake8-bugbear
    "B",
    # Performance
    "PERF",
    "ANN002", # missing-type-args
    "ANN003", # missing-type-kwargs
    "ANN201", # missing-return-type-undocumented-public-function
    "ANN202", # missing-return-type-private-function
    "ANN205", # missing-return-type-static-method
    "ANN206", # missing-return-type-class-method
    # isort
    "I001",
    # Enable entire ruff rule section
    "ASYNC", # subset of flake8-async rules
    "TCH",   # Rules around TYPE_CHECKING blocks
    "G",     # flake8-logging-format rules
    "LOG",   # flake8-logging rules, most of them autofixable
    "PT",    # flake8-pytest-style rules
    "TID25", # flake8-tidy-imports rules
    # Per rule enables
    # "RUF100", # Unused noqa (auto-fixable)
    # We ignore more pydocstyle than we enable, so be more selective at what we enable
    # "D101", # Missing docstring in public class
    "D106",
    # "D2",
    "D3",
    # "D400", # First line should end with a period
    # "D401", # First line of docstring should be in imperative mood
    "D402",
    "D403",
    "D412",
    "D419",
    "PGH004", # Use specific rule codes when using noqa
    "PGH005", # Invalid unittest.mock.Mock methods/attributes/properties
    "RUF006", # Store a reference to the return value of asyncio.create_task
    # "S101", # Checks use `assert` outside the test cases, test cases should be added into the exclusions
    "B004",   # Checks for use of hasattr(x, "__call__") and replaces it with callable(x)
    "B006",   # Checks for uses of mutable objects as function argument defaults.
    "B017",   # Checks for pytest.raises context managers that catch Exception or BaseException.
    "B019",   # Use of functools.lru_cache or functools.cache on methods can lead to memory leaks
    "TRY002", # Prohibit use of `raise Exception`, use specific exceptions instead.
    "T201",   # No print statements
    "D3",  # pydocstyle Quotes Issues
    "D4",  # pydocstyle Docstring Content Issues
    "D207",  # Docstring is under-indented
    "D208",  # Docstring is over-indented
    "D210",  # No whitespaces allowed surrounding docstring text
    "D211",  # No blank lines allowed before class docstring
    "D214",  # Section is over-indented
    "D215",  # Section underline is over-indented
    "PLW1514", # Unspecified encoding in open()
    "UP",  # Upgrades
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/{tests}/*" = ["ANN201", "ANN202", "T201", "D", "F841", "PLW1514"]
"dagger/*" = ["TID252"]
# Prefer multi-line "\n".join([...]) expected strings in codegen tests.
"tests/_ast/test_codegen.py" = ["FLY002"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]
combine-as-imports = true

[tool.ruff.lint.flake8-type-checking]
exempt-modules = ["typing", "typing_extensions"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.flake8-tidy-imports]
# Disallow all relative imports.
ban-relative-imports = "all"
# Ban certain modules from being imported at module level, instead requiring
# that they're imported lazily (e.g., within a function definition).
banned-module-level-imports = [
    "altair",
    "anywidget",
    "chdb",
    "clickhouse_connect",
    "duckdb",
    "ipython",
    "numpy",
    "packaging",
    "pandas",
    "polars",
    "psutil",
    "pyarrow",
    "redis",
    "sqlalchemy",
    "obstore",
    "huggingface_hub",
    "fsspec",
    "sqlglot",
    "tomlkit",
    "typing_extensions",
    "pyiceberg",
    "redshift_connector",
    "starrocks",
    "pydantic_ai",
    # a top-level import of zmq may break WASM
    "zmq"
]

[tool.ruff.lint.flake8-pytest-style]
mark-parentheses = false
fixture-parentheses = false

[tool.mypy]
strict = true
exclude = [
    'examples',
    'tests/_ast/app_data',
    'tests/_ast/codegen_data',
    'tests/_ast/cell_data',
    'tests/_cli/cli_data',
    'tests/_runtime/runtime_data',
    'marimo/_snippets/data/',
    'marimo/_smoke_tests/',
]
warn_unused_ignores = false

# ibis ships no py.typed marker and has no stub package on PyPI (checked
# through ibis-framework 12.0.0). Whether mypy reports `import-not-found` or
# `import-untyped` for it depends on whether ibis happens to be installed in
# the environment mypy runs in, so the inline `type: ignore[import-not-found]`
# comments in marimo/ are only correct half the time. Settle it here instead.
[[tool.mypy.overrides]]
module = ["ibis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q -v --ignore tests/_cli/fixtures --ignore tests/_ast/codegen_data --ignore tests/_ast/app_data"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120 # seconds, per test (Windows CI needs extra headroom)
faulthandler_timeout = 120 # seconds, during collection
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "flaky: marks tests that are known to be flaky",
    "requires(dep1, dep2, ...): requires one or more dependencies to be installed",
]

[tool.coverage.run]
omit = ["marimo/_tutorials/*"]

[tool.typos.default]
extend-ignore-re = ["[0-9a-zA-Z_-]{43}"]

[tool.typos.default.extend-words]
wheres = "wheres"
Ue = "Ue"         # Used in one of the cell IDs
Nd = "Nd"         # Confused with And
pn = "pn"         # Panel
caf = "caf"       # cafe
ser = "ser"       # Used in pydantic-core package as part of a function name
oint = "oint"     # Contour integrals in markdown completions

[tool.typos.files]
extend-exclude = [
    "MultiSelectPlugin.test.ts",
    "module_name_to_pypi_name.py",
    "**/pnpm-lock.yaml",
    "**/snapshots/*",
    "**/__demo__/*",
    "base64.test.ts",
    "SECURITY.md", # Contains usernames that trigger typos
    "patches/*", # Patches may contain typos from source code,
    "frontend/dist/assets/*", # Assets may contain typos from source code
    "tests/_sql/test_sql_parse.py", # Contains intentional invalid SQL for testing
]


[tool.marimo.ai]
rules = "- prefer polars over pandas\n- make charts using altair"

[tool.marimo.save]
autosave_delay = 1000
autosave = "after_delay"
format_on_save = true

[tool.marimo.experimental]
multi_column = true
cache_panel = true
isolate_apps = true

[tool.marimo.display]
dataframes = "rich"

[tool.marimo.runtime]
auto_instantiate = false
watcher_on_save = "autorun"
output_max_bytes = 10_000_000
std_stream_max_bytes = 2_000_000
dotenv = [".env"]

[tool.marimo.package_management]
manager = "uv"

[tool.marimo.keymap]
vimrc = "configs/.vimrc"

[tool.basedpyright]
reportUnusedCallResult = false

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]
# Required by the [tool.pixi.package] section below. Note this is the third
# preview/experimental gate in the packaging path, alongside rattler-build's
# --v3 and the v3 repodata format itself — expect churn here before v3 settles.
preview = ["pixi-build"]

# Makes this workspace buildable as a conda package. The recipe is the source
# of truth — `recipe/recipe.yaml` — because it needs v3 extras and a build-time
# selector that the pixi manifest cannot express. `version` here is not read
# from `[project]`, so it must track it; the CI packaging job asserts they match.
[tool.pixi.package]
name = "marimo-r"
version = "0.24.0"

[tool.pixi.package.build]
backend = {name = "pixi-build-rattler-build", version = "*"}

[tool.pixi.dependencies]
make = ">=4.4.1"
pre_commit = ">=4.6.0"
uv = ">=0.11.14"
hatch = ">=1.16.5"
# Builds the conda package; see the `package` task and recipe/recipe.yaml.
rattler-build = ">=0.74"
python = "3.13.*"
pip = ">=25.0.1"

[tool.pixi.pypi-dependencies]
marimo-r = {path = ".", editable = true}

# The JS toolchain, in its own feature for the same reason as R below: the
# frontend needs node and pnpm but no python, uv, or the editable marimo
# install. Keeping it separable lets CI's frontend job install just this.
#
# It stays part of the default environment too, so `make dev` and `make fe`
# behave as before, and the shared solve-group guarantees both environments
# resolve to the same node.
#
# pnpm's version is effectively set by the `packageManager` field in
# package.json, which pnpm honours by self-switching; this bound only needs to
# be new enough to support that.
[tool.pixi.feature.node.dependencies]
nodejs = ">=24.14.1"
pnpm = ">=10.33.1"

# R toolchain and R package dependencies.
#
# This is a feature rather than a plain dependency block so that the R
# environment can be built with `no-default-feature`: the R environment below
# contains R and its packages and nothing else. It deliberately does not inherit
# python, node, uv, or the editable marimo install, because marimo spawns R as a
# subprocess — the two runtimes only need to agree on a file format (Arrow), not
# share an environment. Keeping them apart also means `pixi install` for normal
# Python work never has to solve or download the ~500MB R toolchain.
[tool.pixi.feature.r.dependencies]
r-base = ">=4.4,<5"
# Required by marimo/_r/resources/r_backend.R.
r-jsonlite = ">=1.8"
r-arrow = ">=17"
# Optional: enables registering Arrow inputs as DuckDB tables in R.
r-dbi = ">=1.2"
# Exercised by the plot-capture tests in tests/_r/test_session.py.
r-ggplot2 = ">=3.5"

# R language servers, all three backends marimo/_server/lsp.py can drive.
# air and jarl are self-contained Rust binaries; r-languageserver is the R
# package. lintr and styler are not optional extras — r-languageserver shells
# out to them for diagnostics and formatting, and without them that backend
# starts but reports nothing and formats nothing.
air = ">=0.11"
jarl = ">=0.5"
r-languageserver = ">=0.3.16"
r-lintr = ">=3.1"
r-styler = ">=1.10"

# r-duckdb has no linux-aarch64 build on conda-forge, and r_backend.R guards its
# use behind requireNamespace(), so it is scoped to the platforms that have it
# rather than dropped or allowed to fail the solve.
[tool.pixi.feature.r.target.linux-64.dependencies]
r-duckdb = ">=1.1"

[tool.pixi.feature.r.target.osx-arm64.dependencies]
r-duckdb = ">=1.1"

[tool.pixi.feature.r.tasks]
# A REPL in the same isolated library marimo will use.
r-repl = "R --vanilla --quiet"
r-version = "Rscript --vanilla -e 'cat(R.version.string, \"\\n\"); print(.libPaths())'"

[tool.pixi.environments]
default = {features = ["node"], solve-group = "default"}
node = {features = ["node"], no-default-feature = true, solve-group = "default"}
r = {features = ["r"], no-default-feature = true}

[tool.pixi.tasks]
# Tasks already run inside the environment, so they call tools directly rather
# than nesting another `pixi run`.

# --- building -------------------------------------------------------------
# Kept separate from the launch tasks below on purpose: `make fe` takes about a
# minute even when nothing changed, which is too slow to pay on every launch.
# Build when you have changed code; launch as often as you like.
build = {cmd = "make py && make fe", description = "Build the frontend and install marimo editable"}
# The wheel must carry the built frontend (MANIFEST.in ships marimo/_static and
# marimo/_lsp), so this depends on `build` rather than assuming it ran.
wheel = {cmd = "rm -rf dist && uv build --wheel --out-dir dist", depends-on = ["build"], description = "Build the wheel, frontend assets included"}
# The conda package is the supported artifact: R is not pip-installable, so a
# wheel alone cannot deliver a working install. Needs --v3 for the extras in
# recipe/recipe.yaml. Builds only — publishing is a deliberate manual step.
package = {cmd = "rattler-build build --v3 --recipe recipe/recipe.yaml --output-dir build/conda", depends-on = ["wheel"], description = "Build the marimo-r conda package"}
# Uploads to the `universe` channel at prefix.dev. Deliberately separate from
# `package`, and never wired into a build: publishing is irreversible for a
# given version+build number. Needs PREFIX_API_KEY, or a prior
# `pixi auth login prefix.dev`.
publish = {cmd = "rattler-build upload prefix --channel universe build/conda/*/*.conda", description = "Upload the built package to prefix.dev/universe"}
dev = {cmd = "make dev", description = "Dev server with frontend hot-reloading (no build needed)"}

# --- manual testing -------------------------------------------------------
# Start here. Reports which R the cells will use, which R the language server
# will use, and whether the editor will attach to it — the things that are
# invisible from clicking around a notebook.
r-doctor = {cmd = "python scripts/fork/r_doctor.py", description = "Preflight R and R LSP setup"}

# `--extra=recommended` because the example notebooks use polars, duckdb, and
# altair, which the editable install alone does not bring in.
r-edit = {cmd = "uv run --extra=recommended marimo edit {{ notebook }}", args = [{arg = "notebook", default = "examples/r/marimo_r_example.py"}], description = "Edit an R notebook (default: the simple example)"}
r-run = {cmd = "uv run --extra=recommended marimo run {{ notebook }}", args = [{arg = "notebook", default = "examples/r/marimo_r_example.py"}], description = "Run an R notebook as an app"}
r-exec = {cmd = "uv run --extra=recommended python {{ notebook }}", args = [{arg = "notebook", default = "examples/r/marimo_r_example.py"}], description = "Execute an R notebook as a plain script"}
r-check-examples = {cmd = "uv run --extra=recommended marimo check --fix examples/r/", description = "Lint and fix the R example notebooks"}

# --- automated tests ------------------------------------------------------
# test-optional, matching CI: with only the `test` group the pandas/polars/
# pyarrow conversions importorskip away instead of running.
test_r = {cmd = "uv run --group test-optional pytest tests/_r", description = "R tests against the pixi R"}
test_r_frontend = {cmd = "pnpm --filter @marimo-team/frontend test src/core/codemirror/language/__tests__/r.test.ts src/core/codemirror/lsp/__tests__/notebook-lsp.test.ts", description = "R frontend tests"}
# Should print only the pixi library path, even with R_LIBS_USER set.
check_r_isolation = {cmd = "python -c \"import marimo; print(marimo.r('paste(.libPaths(), collapse=\\\"|\\\")', output=False, plot=False))\"", description = "Prove the R subprocess ignores a global R library"}

