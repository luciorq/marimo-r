[build-system]
requires = ["uv_build>=0.8.3,<0.13.0"]
build-backend = "uv_build"

[project]
# The distribution is `marimo-r`; the *import* name stays `marimo` (see
# [tool.uv.build-backend] module-name below), so this is a drop-in
# replacement that deliberately cannot be co-installed with upstream.
name = "marimo-r"
version = "0.24.0"
description = "A library for making reactive notebooks and apps"
# We try to keep dependencies to a minimum, to avoid conflicts with
# user environments; we need a very compelling reason for each dependency added.
# Dependencies should have lower bounds, which should be as loose as possible.
dependencies = [
    # For maintainable cli
    "click>=8.0,<9; sys_platform != 'emscripten'",
    # code completion (upper bound applied temporarily for resolution)
    "jedi>=0.18.0,<0.20.0",
    # compile markdown to html
    "markdown>=3.6,<4",
    # add features to markdown
    # - 10.11.2 introduced the codeblock handling we rely on
    # - 10.21.2 stopped passing `filename=None` to pygments (broken on
    #   pygments>=2.20)
    "pymdown-extensions>=10.21.2,<12",
    # syntax highlighting of code in markdown
    "pygments>=2.19,<3",
    # for reading, writing configs
    "tomlkit>=0.12.0",
    # for managing frontmatter headers in markdown
    "pyyaml>=6.0.1",
    # web server
    # - 0.22.0 introduced timeout-graceful-shutdown, which we use
    "uvicorn>=0.22.0; sys_platform != 'emscripten'",
    # web framework
    # - 0.29.0 introduced Middleware kwargs, which we use
    # - starlette 0.36.0 introduced a bug
    # - starlette 0.37.2 fixed httpx 0.28 compatibility
    "starlette>=0.37.2; sys_platform != 'emscripten'",
    # multipart form parsing for file uploads (Starlette's request.form() requires it)
    "python-multipart>=0.0.18",
    # websockets for use with starlette, and for lsp
    "websockets >= 14.2.0; sys_platform != 'emscripten'",
    # loro for collaborative editing (native extension; server-only)
    "loro>=1.10.0; sys_platform != 'emscripten' and sys_platform != 'android'",
    # python <=3.10 compatibility
    "typing_extensions>=4.4.0; python_version < '3.12'",
    # for rst parsing; lowerbound determined by awscli requiring < 0.17,
    "docutils>=0.16.0",
    # to show RAM, CPU usage, other system utilities
    "psutil>=5.0; sys_platform != 'emscripten' and sys_platform != 'android'",
    # required dependency in Starlette for SessionMiddleware support
    "itsdangerous>=2.0.0",
    # for dataframe support
    "narwhals>=2.0.0",
    # for packaging.version; not sure what the lower bound is.
    "packaging",
    "msgspec>=0.20.0",
    # for IPC, required for marimo edit --sandbox, marimo run <multiple notebooks>
    "pyzmq>=27.1.0; python_version < '3.15' and sys_platform != 'emscripten'",
    "anywidget>=0.9.21",
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
marimo = "marimo._cli.cli:main"

[project.urls]
homepage = "https://github.com/marimo-team/marimo"

[project.entry-points."docstring_to_markdown"]
marimo_converter = "marimo._utils.docs:MarimoConverter"

[project.optional-dependencies]
sql = [
    "duckdb>=1.0.0",           # SQL cells
    "polars[pyarrow]>=1.9.0",  # SQL output back in Python
    "sqlglot[c]>=26.8.0"       # SQL cells parsing;
]

# For per-notebook sandboxed kernels
sandbox = [
    "pyzmq>=27.1.0",           # IPC communication for sandbox kernels
    "uv>=0.9.21",              # for sandbox management and local html-wasm exports
]

# List of deps that are recommended for most users
# in order to unlock all features in marimo
recommended = [
    "marimo-r[sql]",
    "marimo-r[sandbox]",                           # For `marimo edit --sandbox DIRECTORY`
    "cryptography>=42.0.0",                      # Ed25519 signing of persistent cache manifests
    "altair>=5.4.0",                             # Plotting in datasource viewer
    "pydantic-ai-slim[openai]>=1.107.0,<3.0.0",  # AI features
    "ruff",                                      # Formatting
    "nbformat>=5.7.0",                           # Export as IPYNB
]

lsp = [
    "python-lsp-server>=1.13.0",
    "python-lsp-ruff>=2.0.0",
]

mcp = [
    "mcp>=1.0.0,<2", # MCP 2.0 is a major rework, unsupported for now.
    "pydantic>2",
]

otel = [
    "opentelemetry-api~=1.28.0",
    "opentelemetry-sdk~=1.28.0",
    "opentelemetry-exporter-otlp-proto-http~=1.28.0",
