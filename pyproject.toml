    "vegafusion",
    "pyarrow>=19.0.1",
    "pyarrow_hotfix",
    "altair>=5.4.0",
    "plotly>=5.14.0",
    "polars>=1.32.2",
    "sqlglot[c]>=26.8.0",
    "sqlalchemy>=2.0.40",
    "obstore>=0.8.2",
    "huggingface-hub>=1.24.0",
    "fsspec>=2026.2.0",
    "pyiceberg>=0.9.0",
    "cloudpathlib>=0.23.0",
    # For testing clickhouse
    "chdb>=3; platform_system != 'Windows'", # there is no suitable wheel for windows
    "clickhouse-connect>=0.8.18",
    "redshift-connector[full]>=2.1.7",
    # For testing starrocks
    "starrocks>=1.3.0",
    "pandas>=1.5.3",
    "hvplot~=0.11.3",
    "geopandas>=1.1.0",
    "duckdb>=1.0.0",
    "ibis-framework[duckdb]>=10.3.0",
    # For testing mo.image
    "pillow~=12.0.0",
